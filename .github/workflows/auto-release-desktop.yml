name: Auto-release desktop

# Cuts a full desktop release (macOS + Windows + Linux) whenever the desktop app
# changes on main. The version is auto-bumped from the latest v* tag, so nothing
# is committed back to main (no loops, no lockfile churn) — the reusable release
# workflow injects that version at build time and publishes the GitHub Release.
on:
  # NOT on every push to main. This workflow publishes to the PUBLIC download
  # bucket, and running it per-commit repeatedly overwrote newer releases with an
  # older, ad-hoc-signed build (ad-hoc signing also resets users' macOS TCC grants
  # every update). Releases are now deliberate: dispatch it, or push a v* tag.
  workflow_dispatch:

permissions:
  contents: write # the reusable release workflow creates the GitHub Release
  id-token: write # so the reusable workflow's publish-downloads job can mint the OIDC token for keyless GCS upload (WIF)

# Serialize so two quick pushes can't race on the same version number.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the full tag history to find the latest release
      - name: Compute next version (patch bump from the latest v* tag)
        id: ver
        run: |
          # The version must NEVER go backwards: publishing an older build overwrites
          # the public download and permanently strands auto-update (electron-updater
          # refuses to move users to a lower version). Deriving purely from the newest
          # v* tag did exactly that — tags lagged at v1.8.4 while main was 1.9.3, so
          # every run rebuilt "1.8.5" and clobbered the live release. package.json on
          # main is authoritative whenever it is ahead of the newest tag.
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          LATEST=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          BASE=${LATEST#v}
          BASE=${BASE:-0.0.0}
          HIGHEST=$(printf '%s\n%s\n' "$PKG" "$BASE" | sort -V | tail -n1)
          if [ "$HIGHEST" = "$PKG" ] && [ "$PKG" != "$BASE" ]; then
            NEXT="$PKG"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$HIGHEST"
            NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next desktop release: v$NEXT (base $BASE, latest tag ${LATEST:-none})"

  release:
    needs: prepare
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit
