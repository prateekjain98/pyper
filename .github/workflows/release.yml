name: Release

# The desktop app lives in apps/desktop within this npm-workspaces monorepo.
# GitHub only runs workflows from the repo-root .github/workflows, so this file
# lives at the root and each job defaults its run steps to apps/desktop. Steps
# that must operate on the workspace root (npm ci / npm install / npm rebuild /
# npm audit against the root lockfile + hoisted node_modules) override
# working-directory back to ${{ github.workspace }}.

on:
  push:
    tags:
      - "v*.*.*" # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version to release, passed by the auto-release workflow"
        required: true
        type: string

permissions:
  contents: write # Required for creating releases

env:
  # A version input (manual dispatch or auto-release via workflow_call) wins; else
  # the pushed git tag. github.event_name is unreliable here: inside a reusable
  # workflow it reflects the CALLER's event, never "workflow_call".
  RELEASE_TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/desktop/.nvmrc
      - name: Validate release inputs
        env:
          MICROSOFT_CALENDAR_CLIENT_ID: ${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          # Tag pushes (no version input) must match package.json. Dispatch/auto-release
          # provide a version and inject it at build time, so skip the match check.
          if [ -z "$INPUT_VERSION" ] && [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION"
            exit 1
          fi
          if [ -z "$MICROSOFT_CALENDAR_CLIENT_ID" ]; then
            echo "::warning::MICROSOFT_CALENDAR_CLIENT_ID is unset — building without Microsoft Calendar OAuth."
          fi
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci --ignore-scripts
      - name: Run quality checks
        run: |
          # Keep the real gates blocking (eslint + typecheck), but treat prettier
          # formatting as non-blocking at release time — it's cosmetic and there is
          # fleet-wide formatting debt that shouldn't block shipping a build.
          npm run lint
          npm run typecheck
          npx prettier --check "**/*.{js,jsx,ts,tsx,json,css,md}" || echo "::warning::Prettier formatting issues found (non-blocking at release time)"
      - name: Check translations
        run: npm run i18n:check
      - name: Audit dependencies
        working-directory: ${{ github.workspace }}
        # Fail the release only on CRITICAL advisories. The current moderate/high
        # findings are transitive and unfixable without breaking upgrades
        # (postcss/sharp via Next, the @ai-sdk provider chain); a critical vuln
        # still blocks the build.
        run: npm audit --audit-level=critical
      - name: Run tests
        run: npm test
        env:
          # keeps require("electron") from throwing when postinstall was skipped
          ELECTRON_OVERRIDE_DIST_PATH: /tmp

  build-linux:
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Install platform-specific native binaries
        working-directory: ${{ github.workspace }}
        run: npm install @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --no-save

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: apps/desktop/resources/bin
          key: linux-x64-bin-${{ hashFiles('apps/desktop/scripts/download-*.js') }}

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download llama-server binaries
        run: node scripts/download-llama-server.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download yt-dlp binary
        run: node scripts/download-yt-dlp.js --current

      - name: Download Qdrant binary
        run: node scripts/download-qdrant.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download meeting AEC helper
        run: node scripts/download-meeting-aec-helper.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: linux-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: linux-electron-

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libx11-dev libxtst-dev libatspi2.0-dev libglib2.0-dev libpipewire-0.3-dev pkg-config

      - name: Create runtime env
        run: |
          echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}" >> .env
          echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}" >> .env
          echo "MICROSOFT_CALENDAR_CLIENT_ID=${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}" >> .env

      - name: Verify PipeWire system audio helper build
        run: |
          npm run compile:linux-system-audio
          # supportsNativeCapture reflects compile-time PipeWire linkage, so this passes on CI runners with no PipeWire daemon (where "ok" is false).
          resources/bin/linux-system-audio-helper probe | grep '"supportsNativeCapture":true'

      - name: Apply release version (auto-release)
        if: ${{ inputs.version }}
        shell: bash
        run: npm version "$REL_VERSION" --no-git-tag-version --allow-same-version
        env:
          REL_VERSION: ${{ inputs.version }}
      - name: Build Application
        run: npm run build:linux -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || 'https://auth.pyper.work' }}

      # Hand the installer to publish-downloads via a same-run artifact (draft-agnostic,
      # unlike `gh release download`, which can't see draft releases from a contents:read token).
      - name: Upload installer for GCS mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyper-installers-linux
          path: apps/desktop/dist/*.AppImage
          if-no-files-found: ignore
          retention-days: 2

  build-windows:
    needs: tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Install platform-specific native binaries
        working-directory: ${{ github.workspace }}
        run: npm install @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc @tailwindcss/oxide-win32-x64-msvc --no-save

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: apps/desktop/resources/bin
          # The system-audio helper source is in the key so a republished
          # helper binary invalidates the cached copy.
          key: windows-x64-bin-${{ hashFiles('apps/desktop/scripts/download-*.js', 'apps/desktop/resources/windows-system-audio-helper.c') }}

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download llama-server binaries
        run: node scripts/download-llama-server.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download yt-dlp binary
        run: node scripts/download-yt-dlp.js --current

      - name: Download Qdrant binary
        run: node scripts/download-qdrant.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download meeting AEC helper
        run: node scripts/download-meeting-aec-helper.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download nircmd.exe
        run: node scripts/download-nircmd.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download windows-fast-paste.exe
        run: node scripts/download-windows-fast-paste.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download windows-key-listener.exe
        run: node scripts/download-windows-key-listener.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download windows-mic-listener.exe
        run: node scripts/download-windows-mic-listener.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download windows-system-audio-helper.exe
        run: node scripts/download-windows-system-audio-helper.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify windows-system-audio-helper.exe
        shell: bash
        run: test -f resources/bin/windows-system-audio-helper.exe

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: windows-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: windows-electron-

      - name: Create runtime env
        shell: bash
        run: |
          echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}" >> .env
          echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}" >> .env
          echo "MICROSOFT_CALENDAR_CLIENT_ID=${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}" >> .env

      - name: Apply release version (auto-release)
        if: ${{ inputs.version }}
        shell: bash
        run: npm version "$REL_VERSION" --no-git-tag-version --allow-same-version
        env:
          REL_VERSION: ${{ inputs.version }}
      - name: Build and Sign Application
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || 'https://auth.pyper.work' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # Hand the installer to publish-downloads via a same-run artifact (see build-linux).
      - name: Upload installer for GCS mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyper-installers-windows
          path: apps/desktop/dist/*.exe
          if-no-files-found: ignore
          retention-days: 2

  build-macos:
    needs: tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Install ffmpeg-static for target architecture
        if: matrix.arch == 'x64'
        working-directory: ${{ github.workspace }}
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: apps/desktop/resources/bin
          key: macos-${{ matrix.arch }}-bin-${{ hashFiles('apps/desktop/scripts/download-*.js', 'apps/desktop/scripts/build-globe-listener.js', 'apps/desktop/resources/macos-globe-listener.swift', 'apps/desktop/scripts/build-macos-fast-paste.js', 'apps/desktop/resources/macos-fast-paste.swift', 'apps/desktop/scripts/build-media-remote.js', 'apps/desktop/resources/macos-media-remote.swift', 'apps/desktop/scripts/build-macos-audio-tap.js', 'apps/desktop/resources/macos-audio-tap.swift') }}

      - name: Compile macos-globe-listener binary
        run: npm run compile:globe -- --arch ${{ matrix.arch }}

      - name: Compile macos-fast-paste binary
        run: npm run compile:fast-paste -- --arch ${{ matrix.arch }}

      - name: Compile macos-media-remote binary
        run: npm run compile:media-remote -- --arch ${{ matrix.arch }}

      - name: Compile macos-audio-tap binary
        run: npm run compile:audio-tap -- --arch ${{ matrix.arch }}

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download llama-server binaries
        run: node scripts/download-llama-server.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download yt-dlp binary
        run: node scripts/download-yt-dlp.js --current --platform darwin --arch ${{ matrix.arch }}

      - name: Download Qdrant binary
        run: node scripts/download-qdrant.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download meeting AEC helper
        run: node scripts/download-meeting-aec-helper.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: macos-${{ matrix.arch }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: macos-${{ matrix.arch }}-electron-

      - name: Setup macOS Code Signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          # No Apple Developer credentials configured → build an ad-hoc-signed,
          # un-notarized app instead of hard-failing the keychain import (an empty
          # cert makes `security import` error). The DMG still opens (Gatekeeper shows
          # "unidentified developer" → Open Anyway). Add the APPLE_* secrets to get a
          # signed + notarized build. Without this, build-macos fails and the whole
          # release (incl. publish-downloads) never runs.
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "::warning::No APPLE_CERTIFICATE_BASE64 secret — building an ad-hoc-signed, un-notarized macOS app."
            echo "MAC_ADHOC=1" >> "$GITHUB_ENV"
            exit 0
          fi
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          API_KEY_PATH=$RUNNER_TEMP/api_key.p8
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > $API_KEY_PATH

          security create-keychain -p "runner" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "runner" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          security set-key-partition-list -S apple-tool:,apple: -s -k "runner" $KEYCHAIN_PATH

          echo "APPLE_API_KEY=$API_KEY_PATH" >> $GITHUB_ENV

      - name: Create runtime env
        run: |
          echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}" >> .env
          echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}" >> .env
          echo "MICROSOFT_CALENDAR_CLIENT_ID=${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}" >> .env

      - name: Apply release version (auto-release)
        if: ${{ inputs.version }}
        shell: bash
        run: npm version "$REL_VERSION" --no-git-tag-version --allow-same-version
        env:
          REL_VERSION: ${{ inputs.version }}
      - name: Build Application (${{ matrix.arch }})
        shell: bash
        run: |
          if [ "${MAC_ADHOC:-0}" = "1" ]; then
            # Ad-hoc signing (identity "-") is electron-builder's keyless path: the app
            # is signed but by nobody, so it opens after "Open Anyway". hardenedRuntime
            # and notarize are turned off because both require a real Developer ID.
            npm run build:mac -- --${{ matrix.arch }} --publish always \
              --config.mac.identity=- \
              --config.mac.hardenedRuntime=false \
              --config.mac.notarize=false
          else
            npm run build:mac -- --${{ matrix.arch }} --publish always
          fi
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL || 'https://auth.pyper.work' }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify packaged macOS native binaries
        run: |
          APP_PATH=$(ls -d dist/mac*/Pyper.app | head -n1)
          for bin in macos-audio-tap macos-globe-listener macos-fast-paste macos-mic-listener macos-text-monitor macos-media-remote; do
            test -x "$APP_PATH/Contents/Resources/bin/$bin" || { echo "Missing in bundle: $bin"; exit 1; }
          done

      - name: Verify the app is code-signed
        run: |
          APP_PATH=$(ls -d dist/mac*/Pyper.app | head -n1)
          # Hard gate: the app must be signed at all (ad-hoc counts). An unsigned app
          # downloads as "damaged and can't be opened", so refuse to publish it — this
          # runs before --publish reaches anonymous users via GCS (publish-downloads).
          codesign -dv "$APP_PATH" 2>&1 || {
            echo "::error::$APP_PATH is not code-signed — refusing to publish. Check the electron-builder mac.identity override.";
            exit 1;
          }
          # Deeper structural check is advisory: ad-hoc bundles can trip --deep --strict
          # on nested helpers yet still open fine, so warn instead of blocking.
          codesign --verify --deep --strict "$APP_PATH" \
            || echo "::warning::codesign --verify --deep --strict reported issues (non-blocking for an ad-hoc build)."

      - name: Upload arch-specific update metadata
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          cp dist/latest-mac.yml "dist/latest-${{ matrix.arch }}-mac.yml"
          gh release upload "$RELEASE_TAG" "dist/latest-${{ matrix.arch }}-mac.yml" --clobber

      # Hand the DMG (+ updater metadata) to publish-downloads via a same-run artifact.
      # This is what actually reaches pyper.work; `gh release download` can't (draft release).
      - name: Upload installer for GCS mirror
        uses: actions/upload-artifact@v4
        with:
          name: pyper-installers-macos-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*-mac.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 2

      - name: Cleanup Certificates
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f $RUNNER_TEMP/build_certificate.p12
          rm -f $RUNNER_TEMP/api_key.p8

  # The repo is private, so GitHub release assets 404 for anonymous visitors.
  # Mirror the installers to the PUBLIC GCS bucket the marketing CTA downloads
  # from (apps/web/lib/useDownload.ts), overwriting stable "latest" names so the
  # download button always serves the newest build with no code change. Keyless
  # via the same Workload Identity Federation the proxy deploy uses.
  publish-downloads:
    needs: [build-linux, build-windows, build-macos]
    # Run after the builds finish even if some failed (only skip on cancel): Windows
    # (Azure) and macOS (Apple) signing need secrets that aren't configured, so those
    # jobs may fail — but we still want to mirror whatever DID build (e.g. the macOS
    # DMG) so the download tracks main. The mirror step only copies assets that exist.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          project_id: pyper-services
          workload_identity_provider: projects/772208668555/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      # Pull the installers straight from the build jobs' same-run artifacts. This is
      # draft-agnostic — the previous `gh release download <tag>` silently returned
      # nothing because electron-builder publishes a DRAFT release, which a contents:read
      # GITHUB_TOKEN can't see, so the mirror no-op'd and the download stayed stale.
      - name: Download built installers (same-run artifacts)
        uses: actions/download-artifact@v4
        with:
          pattern: pyper-installers-*
          path: dl
          merge-multiple: true
      - name: Mirror installers to public GCS (stable "latest" + versioned)
        run: |
          set -euo pipefail
          BUCKET="gs://pyper-desktop-downloads"
          cd dl
          echo "Installers to mirror:"; ls -la
          shopt -s nullglob
          n=0
          put() {
            # $1 = version-stamped name (immutable → cacheable); $2 = stable "latest" alias.
            gcloud storage cp "$1" "$BUCKET/$1"
            # The alias is mutable, so it must NOT be cached — otherwise the next release
            # takes up to the CDN/browser max-age to appear (a slow-motion stale download).
            gcloud storage cp --cache-control="no-store" "$1" "$BUCKET/$2"
            echo "mirrored $1 -> $2"
            n=$((n + 1))
          }
          for f in *arm64*.dmg; do put "$f" "Pyper-latest-arm64.dmg"; done
          for f in *.dmg; do case "$f" in *arm64*) : ;; *) put "$f" "Pyper-latest-x64.dmg" ;; esac; done
          for f in *.exe; do put "$f" "Pyper-latest.exe"; done
          for f in *.AppImage; do put "$f" "Pyper-latest.AppImage"; done
          # macOS auto-update downloads the versioned *-mac.zip that the yml
          # references (Squirrel.Mac updates from the ZIP, not the DMG). The name
          # is immutable, so it's cacheable (no --cache-control). Without this the
          # update CHECK succeeds but the DOWNLOAD 404s — auto-update stays broken.
          for f in *-mac.zip; do gcloud storage cp "$f" "$BUCKET/$f"; echo "mirrored $f"; n=$((n + 1)); done
          # Blockmaps enable differential (delta) downloads; electron-updater
          # falls back to a full download if they're absent, so they're best-effort.
          for f in *.blockmap; do gcloud storage cp "$f" "$BUCKET/$f"; echo "mirrored $f"; n=$((n + 1)); done
          # latest*.yml is the auto-updater feed — also mutable, also no-store.
          for f in latest*.yml; do gcloud storage cp --cache-control="no-store" "$f" "$BUCKET/$f"; echo "mirrored $f"; n=$((n + 1)); done
          # Fail loudly instead of "succeeding" with an empty mirror (the old silent no-op).
          if [ "$n" -eq 0 ]; then
            echo "::error::No installers mirrored to $BUCKET — the desktop download did NOT update. No pyper-installers-* artifacts were produced (did every build job fail?)."
            exit 1
          fi
          echo "Done: mirrored $n file(s) to $BUCKET."
