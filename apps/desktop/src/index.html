<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/fonts/noto-sans.css">
    <link rel="stylesheet" href="./assets/fonts/crimson-text.css">
    <title>Pyper</title>
    <script>
      // DEV AFFORDANCE: when the renderer runs in a plain browser (e.g. the
      // `desktop-renderer` preview) instead of Electron, stub the native bridge so the
      // UI still renders for visual / Wispr-Flow-parity work. Inert inside Electron,
      // where window.electronAPI is defined by the preload before this script runs.
      (function () {
        if (window.electronAPI) return;
        const unsub = () => {};
        const api = new Proxy(
          {},
          {
            get(_t, prop) {
              const name = String(prop);
              if (name === "then") return undefined;
              if (name === "getPlatform" || name === "getCachedPlatform") return () => "darwin";
              if (name.startsWith("on") || name.startsWith("subscribe") || name.startsWith("once"))
                return () => unsub;
              // Token getters resolve to null (falsy): callers presence-check the
              // result (`if (token) …`), so a truthy [] would spuriously fire
              // flows like the pending-invitation modal.
              if (/token$/i.test(name)) return () => Promise.resolve(null);
              // Other data methods resolve to an empty array, not undefined:
              // list-backed views (history, notes, spaces…) read `.length`/`.map`
              // on the result, and `[]` is safe for those and for property/deref
              // access (→ undefined) alike, so the dashboard renders in a plain
              // browser instead of tripping the error boundary.
              return () => Promise.resolve([]);
            },
          }
        );
        window.electronAPI = api;
        window.api = api;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
